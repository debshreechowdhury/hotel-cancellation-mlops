# =============================================================================
# Pipeline configuration — every tunable knob lives here.
# Override any value from the CLI without editing this file, e.g.:
#   python -m src.train --set model.type=random_forest --set split.test_size=0.2
# =============================================================================

project:
  name: hotel-cancellation
  seed: 42

data:
  # Where training data is read from: "gcs" (Google Cloud Storage) or "local".
  # Env var DATA_SOURCE overrides this (handy for CI / offline runs).
  source: gcs
  gcs_bucket: YOUR_BUCKET_NAME            # env var GCS_BUCKET overrides this
  gcs_blob: data/hotel_bookings_clean.csv
  raw_path: data/raw/hotel_bookings.csv          # Kaggle download goes here
  clean_path: data/processed/hotel_bookings_clean.csv
  target: is_canceled

preprocess:
  drop_duplicates: true
  adr_max: 1000          # drop rows with average daily rate above this (outliers)
  # Columns that leak the answer (they are only known AFTER a booking is
  # cancelled or checked out) plus high-missingness ID columns.
  drop_columns:
    - reservation_status
    - reservation_status_date
    - assigned_room_type
    - agent
    - company

features:
  numeric:
    - lead_time
    - stays_in_weekend_nights
    - stays_in_week_nights
    - adults
    - children
    - babies
    - is_repeated_guest
    - previous_cancellations
    - previous_bookings_not_canceled
    - booking_changes
    - days_in_waiting_list
    - adr
    - required_car_parking_spaces
    - total_of_special_requests
  categorical:
    - hotel
    - arrival_date_month
    - meal
    - market_segment
    - distribution_channel
    - reserved_room_type
    - deposit_type
    - customer_type
  # Engineered inside the sklearn Pipeline (see src/features.py), so the API
  # only needs raw booking fields.
  engineered:
    - total_nights
    - total_guests
  # Country is predictive but acts as a proxy for nationality. Off by default —
  # see the Ethics section of the README. Flip to true to compare in W&B.
  include_country: false
  min_category_frequency: 20

split:
  test_size: 0.15
  val_size: 0.15
  stratify: true

model:
  # One of: hist_gradient_boosting | random_forest | logistic_regression
  type: hist_gradient_boosting
  threshold: 0.5          # probability above which we predict "will cancel"
  params:
    hist_gradient_boosting:
      learning_rate: 0.1
      max_iter: 300
      max_leaf_nodes: 31
      l2_regularization: 0.0
    random_forest:
      n_estimators: 200
      max_depth: 16
      min_samples_leaf: 5
      n_jobs: -1
    logistic_regression:
      C: 1.0
      max_iter: 2000

evaluation:
  permutation_importance_samples: 2000
  permutation_importance_repeats: 3

tracking:
  # "wandb" or "none". WANDB_MODE env var (online/offline/disabled) is respected.
  backend: wandb
  project: hotel-cancellation
  entity: null            # your W&B team/user name, or null for your default

output:
  model_dir: models
  model_file: model.joblib
  metadata_file: metadata.json
  reports_dir: reports
